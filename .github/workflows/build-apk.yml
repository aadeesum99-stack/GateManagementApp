name: Build Gate Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q GateManagement_APK_Ready_v1.2_About_App.zip -d build-project

      - name: Build APK
        working-directory: build-project/GateManagement_APK_Ready
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gate-Management-APK
          path: build-project/GateManagement_APK_Ready/app/build/outputs/apk/debug/app-debug.apk
